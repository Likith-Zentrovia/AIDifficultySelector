# AI Difficulty Selector Configuration

# Complexity scoring thresholds
scoring:
  # Documents with score below this are considered "simple"
  # Most text-based PDFs should fall here (even multi-column)
  simple_threshold: 25
  # Documents with score above this are considered "complex"
  # Only PDFs with many images, tables, or scanned content
  complex_threshold: 60

# Feature weights for complexity scoring (must sum to 100)
# Focused on what ACTUALLY makes PDF-to-XML conversion difficult
weights:
  image_count: 35        # Many images (5+) = needs AI
  complex_tables: 25     # Multiple complex tables = needs AI
  font_variety: 15       # Many fonts (5+) = complex formatting
  is_scanned: 15         # Scanned docs ALWAYS need OCR/AI
  has_forms: 10          # Interactive forms are complex

# Thresholds for flagging complexity
complexity_thresholds:
  # Only flag as complex if MORE than these counts
  min_images_for_complex: 5      # 5+ images = complex
  min_tables_for_complex: 3      # 3+ tables = complex
  min_fonts_for_complex: 5       # 5+ fonts = complex

# PDF Analysis settings
pdf_analysis:
  # Minimum image size (pixels) to count as significant
  # Small icons/bullets are ignored
  min_image_size: 100
  # Sample pages for large documents (0 = analyze all)
  sample_pages: 0
  # Enable OCR-based text detection for scanned pages
  detect_scanned_pages: true

# EPUB Analysis settings
epub_analysis:
  # Check for embedded media
  check_media: true
  # Analyze CSS complexity
  analyze_css: true

# Tool routing configuration
tools:
  simple:
    name: "simple_converter"
    description: "Fast non-AI conversion for simple documents"
    # Command template - {input} and {output} are placeholders
    command: null  # Configure your tool command here

  complex:
    name: "ai_converter"
    description: "AI-powered conversion for complex documents"
    command: null  # Configure your tool command here

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
